name: uikit_tab_bar
description: >-
  Native iOS 26+ tab bar (UITabBarController, Liquid Glass) for Flutter with
  minimize on scroll, accessory and search tab; CupertinoTabBar fallback
  elsewhere.
version: 0.1.0
repository: https://github.com/lorenzkromer/uikit_tab_bar
issue_tracker: https://github.com/lorenzkromer/uikit_tab_bar/issues
topics:
  - tab-bar
  - ios
  - liquid-glass
  - cupertino
  - navigation

screenshots:
  - description: Native Liquid Glass tab bar with bottom accessory
    path: doc/screenshots/bar.png
  - description: Tab bar minimized while scrolling, accessory inline
    path: doc/screenshots/minimized.png
  - description: Native search tab, text reported to Dart
    path: doc/screenshots/search.png
  - description: Dark appearance following the app theme
    path: doc/screenshots/dark.png

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: UikitTabBarPlugin
